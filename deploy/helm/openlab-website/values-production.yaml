# Production — domaine apex + replicas 2 + ressources standards.
# Aligné sur les valeurs par défaut de values.yaml mais explicité ici
# pour traçabilité et override clair.

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

ingress:
  hosts:
    - host: openlabconsulting.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.openlabconsulting.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openlab-tls
      hosts:
        - openlabconsulting.com
        - www.openlabconsulting.com

config:
  NEXT_PUBLIC_SITE_URL: 'https://openlabconsulting.com'
  PAYLOAD_PUBLIC_SERVER_URL: 'https://openlabconsulting.com'
  BETTER_AUTH_URL: 'https://openlabconsulting.com'
  OPENLAB_TIER: 'production'
  ZEPTOMAIL_API_URL: 'https://api.zeptomail.com/v1.1/email'
  EMAIL_FROM: 'noreply@openlabconsulting.com'
  EMAIL_FROM_NAME: 'OpenLab Consulting'
  EMAIL_TEAM: 'waopron@openlabconsulting.com'
  # 2FA admin OBLIGATOIRE (OWASP A07, CLAUDE.md §11.2 — finding critique de
  # l'audit 2026-06-02). Tout utilisateur authentifié sans session TOTP valide
  # est redirigé vers /admin-2fa : enrôlement automatique (QR code) au premier
  # accès, challenge ensuite — pas de risque de lockout à l'activation.
  # Break-glass : repasser à 'false' (rolling restart via checksum/config) ou
  # `UPDATE users SET totp_enabled=false WHERE email='...'` en base.
  ENFORCE_ADMIN_2FA: 'true'
  # File de tâches COUPÉE en production depuis l'incident du 2026-08-07.
  # L'exécution automatique (`jobs.autoRun`, payload.config.ts) laissait une
  # transaction ouverte par réplique à chaque tour de cron : 5 connexions
  # « idle in transaction » permanentes, jamais rendues au pool, jusqu'à
  # saturer PostgreSQL (44 sessions bloquées sur 56 après sept jours
  # d'uptime) et rendre le site injoignable. Mesure d'endiguement, le temps
  # de corriger la fuite dans le pipeline de rapport d'audit : repasser à
  # 'false' (ou retirer la clé) une fois le correctif livré — le rollout
  # est automatique via checksum/config.
  PAYLOAD_DISABLE_JOBS: 'true'

# Job de migration Payload ACTIVÉ : utilise l'image migrator dédiée
# (Dockerfile stage `migrator` — toolchain complet + /bin/sh) qui lance
# `tsx scripts/payload-migrate.ts`. Idempotent (Payload skip les migrations
# déjà appliquées → no-op si rien de nouveau). Le runner applicatif reste
# Chainguard standalone (incapable de migrer) — ne PAS pointer le Job dessus.
# release.yml publie `…/website-migrate:X.Y.Z` à chaque release ; le tag suit
# image.tag (piloté par ArgoCD Image Updater).
migrate:
  enabled: true
